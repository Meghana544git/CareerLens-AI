# Validates the Dart client and generates committed Android, web, and Windows runner projects.
name: Flutter build and platform scaffolding
on:
  push:
    branches: [flutter-app]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-app
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform projects
        run: flutter create --project-name career_lens_ai --platforms android,web,windows .
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
              text = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
              text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
              if text != original:
                  path.write_text(text)
                  print(f"Updated {path} to SDK 36")
                  found = True
              elif re.search(r'compileSdk(?:Version)?\s*=?\s*36', text):
                  print(f"{path} already targets SDK 36")
                  found = True
          if not found:
              raise SystemExit("Could not find a supported Android compile SDK setting")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib/main.dart
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Build Flutter Web
        run: flutter build web
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Commit generated platform folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android web windows
          if ! git diff --cached --quiet; then
            git commit -m "Generate Flutter platform runners"
            git push origin flutter-app
          else
            echo "Platform runners already committed."
          fi
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: careerlens-ai-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: careerlens-ai-android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: careerlens-ai-web
          path: build/web/
